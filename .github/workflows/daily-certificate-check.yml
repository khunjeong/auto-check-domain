name: Daily asset expiry check

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

jobs:
  check-certificates:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run certificate check
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CERTIFICATE_SHEET_NAME: ${{ vars.GOOGLE_CERTIFICATE_SHEET_NAME }}
          GOOGLE_DOMAIN_SHEET_NAME: ${{ vars.GOOGLE_DOMAIN_SHEET_NAME }}
          GOOGLE_VENDOR_SHEET_NAME: ${{ vars.GOOGLE_VENDOR_SHEET_NAME }}
          TEAMS_WORKFLOW_URL: ${{ secrets.TEAMS_WORKFLOW_URL }}
        run: npm run check
